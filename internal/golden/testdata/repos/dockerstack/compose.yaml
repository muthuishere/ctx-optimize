services:
  api:
    image: ghcr.io/golden/api:2.0.0
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
  db:
    image: postgres:16
    ports: ["5432:5432"]
  cache:
    image: redis:7
  worker:
    build: ./worker
    depends_on:
      - db
      - cache
