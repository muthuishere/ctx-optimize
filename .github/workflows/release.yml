# Release: tag vX.Y.Z → cross-compile via goreleaser → publish the npm
# wrapper + platform packages via OIDC trusted publishing (tokenless).
#
# One-time setup on npmjs.com (owner, web UI — no API for this):
#   for EACH package (@muthuishere/ctx-optimize and the 5 platform packages):
#   Package → Settings → Trusted Publisher → GitHub Actions →
#     repository: muthuishere/ctx-optimize, workflow: release.yml
# Until that's flipped, this workflow needs an NPM_TOKEN secret fallback.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # goreleaser publishes the GitHub Release + binaries
  id-token: write # OIDC — this is what npm trusted publishing consumes

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5 — node's bundled npm can lag
      - run: npm install -g npm@latest && npm --version
      - name: gate
        run: go vet ./... && go test ./...
      - name: build all platforms + publish GitHub Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sync versions to tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          for d in npm npm/platforms/*; do
            (cd "$d" && npm version "$V" --no-git-tag-version --allow-same-version)
          done
          # wrapper's optionalDependencies must pin the same version
          node -e '
            const f="npm/package.json", p=require("./"+f), v=process.env.GITHUB_REF_NAME.slice(1);
            for (const k of Object.keys(p.optionalDependencies)) p.optionalDependencies[k]=v;
            require("fs").writeFileSync(f, JSON.stringify(p,null,2)+"\n");'
      - name: copy README (npm "files" is resolved relative to each package dir)
        run: cp README.md npm/README.md
      # Publishes are ATTEMPTED FOR ALL and idempotent (#15). Two failure modes
      # were unrecoverable before:
      #   • `run:` executes under `bash -e`, so the FIRST platform failure
      #     aborted the loop — 4 good packages never attempted, wrapper skipped.
      #   • a re-run then hit `403/409 already_exists` on whatever DID publish
      #     and aborted again, so the tag was burnt (v0.10.2: a Sigstore 409
      #     killed the run, the re-run failed on already_exists, and v0.10.3
      #     shipped instead).
      # Treating "this exact version is already there" as success makes a re-run
      # complete instead of aborting, which is what makes a tag retryable.
      - name: publish platform packages
        run: |
          set +e
          failed=""
          for d in npm/platforms/*; do
            name=$(node -p "require('./$d/package.json').name")
            ver=$(node -p "require('./$d/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "= $name@$ver already published — skipping"
              continue
            fi
            if (cd "$d" && npm publish --access public); then
              echo "+ $name@$ver published"
            else
              echo "! $name@$ver FAILED"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::platform publish failed for:$failed (the rest succeeded; re-run this job — published versions are skipped)"
            exit 1
          fi
      - name: publish wrapper
        run: |
          set +e
          ver=$(node -p "require('./npm/package.json').version")
          if npm view "@muthuishere/ctx-optimize@$ver" version >/dev/null 2>&1; then
            echo "= wrapper @$ver already published — skipping"
            exit 0
          fi
          cd npm && npm publish --access public
